<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>mysweeper</title>
<meta name="theme-color" content="#12181B" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root {
    --ink: #EDEDEA;
    --dim: #8A9498;
    --bg: #12181B;
    --panel: #1B2327;
    --panel-line: #2B3439;
    --amber: #E8A33D;

    /* one color per weekday, kept legible against a dark basemap */
    --mon: #6FB1E0;
    --tue: #7FC29B;
    --wed: #E0C15C;
    --thu: #E08A5C;
    --fri: #C77FD1;
    --sat: #E06F84;
    --sun: #9AA6D4;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    overflow: hidden;
  }

  #map { position: absolute; inset: 0; }

  .leaflet-container { background: var(--bg); }

  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    pointer-events: none;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.2px;
    color: var(--ink);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    pointer-events: auto;
  }

  .controls {
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }

  .btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--panel-line);
    background: rgba(27, 35, 39, 0.9);
    backdrop-filter: blur(6px);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
  }

  .btn:active { transform: translateY(1px); }

  #panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 500;
    background: var(--panel);
    border-top: 1px solid var(--panel-line);
    border-radius: 16px 16px 0 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(calc(100% - 46px));
    transition: transform 0.25s ease;
  }

  #panel.open { transform: translateY(0); }

  #panel .grip {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--panel-line);
    margin: 0 auto 12px;
    cursor: pointer;
  }

  #panel .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #panel .status {
    font-size: 13px;
    color: var(--dim);
  }

  .legend {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    gap: 8px 12px;
  }

  .legend .item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }

  .legend .swatch {
    width: 14px;
    height: 3px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legend .swatch.dashed {
    height: 0;
    border-top: 2px dashed var(--amber);
  }

  .legend .section-label {
    grid-column: 1 / -1;
    font-size: 11px;
    color: var(--dim);
    margin-top: 8px;
    text-transform: none;
  }

  .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--ink);
    border-radius: 10px;
  }

  .leaflet-popup-tip { background: var(--panel); }

  .popup-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 4px;
  }

  .popup-line {
    font-size: 13px;
    color: var(--dim);
    margin: 2px 0;
  }
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="wordmark">mysweeper</div>
  <div class="controls">
    <button class="btn" id="locate-btn" title="Find me">◎</button>
  </div>
</header>

<div id="panel">
  <div class="grip" id="panel-grip"></div>
  <div class="row">
    <strong style="font-size: 14px;">Legend</strong>
    <span class="status" id="sync-status">loading…</span>
  </div>
  <div class="legend">
    <div class="section-label">Street sweeping</div>
    <div class="item"><span class="swatch" style="background: var(--mon)"></span>Mon</div>
    <div class="item"><span class="swatch" style="background: var(--tue)"></span>Tue</div>
    <div class="item"><span class="swatch" style="background: var(--wed)"></span>Wed</div>
    <div class="item"><span class="swatch" style="background: var(--thu)"></span>Thu</div>
    <div class="item"><span class="swatch" style="background: var(--fri)"></span>Fri</div>
    <div class="item"><span class="swatch" style="background: var(--sat)"></span>Sat</div>
    <div class="item"><span class="swatch" style="background: var(--sun)"></span>Sun</div>
    <div class="section-label">Permit zone</div>
    <div class="item"><span class="swatch dashed"></span>Zone G</div>
  </div>
</div>

<script>
  const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([37.7833, -122.4167], 13);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 19,
  }).addTo(map);

  const weekdayColor = {
    Mon: 'var(--mon)', Tues: 'var(--tue)', Wed: 'var(--wed)', Thu: 'var(--thu)',
    Fri: 'var(--fri)', Sat: 'var(--sat)', Sun: 'var(--sun)', Holiday: '#555',
  };
  // Leaflet needs resolved color strings, not CSS vars — read them from :root.
  const rootStyle = getComputedStyle(document.documentElement);
  for (const k in weekdayColor) {
    const varName = weekdayColor[k].match(/--[a-z]+/);
    if (varName) weekdayColor[k] = rootStyle.getPropertyValue(varName[0]).trim() || '#888';
  }

  async function loadLayer(url, build) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      build(data);
    } catch (err) {
      console.error('Failed to load', url, err);
    }
  }

  loadLayer('data/sweeping.geojson', (data) => {
    L.geoJSON(data, {
      style: (f) => ({
        color: weekdayColor[f.properties.weekday] || '#888',
        weight: 3,
        opacity: 0.85,
      }),
      onEachFeature: (f, layer) => {
        const p = f.properties;
        layer.bindPopup(
          `<div class="popup-title">${p.corridor || 'Unnamed street'}</div>` +
          `<div class="popup-line">${p.limits || ''}</div>` +
          `<div class="popup-line">${p.fullname || p.weekday}, ${p.fromhour}:00–${p.tohour}:00</div>`
        );
      },
    }).addTo(map);
  });

  loadLayer('data/rpp.geojson', (data) => {
    L.geoJSON(data, {
      style: {
        color: rootStyle.getPropertyValue('--amber').trim(),
        weight: 2,
        dashArray: '4 4',
        opacity: 0.7,
      },
      onEachFeature: (f, layer) => {
        const p = f.properties;
        const zones = [p.rpparea1, p.rpparea2, p.rpparea3].filter(Boolean).join(', ');
        layer.bindPopup(
          `<div class="popup-title">Permit zone ${zones}</div>` +
          `<div class="popup-line">${p.days || ''} ${p.hours || ''}</div>`
        );
      },
    }).addTo(map);
  });

  fetch('data/last-synced.json', { cache: 'no-store' })
    .then((r) => r.json())
    .then((j) => {
      const d = new Date(j.synced_at);
      document.getElementById('sync-status').textContent =
        'synced ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    })
    .catch(() => {
      document.getElementById('sync-status').textContent = 'sync status unavailable';
    });

  document.getElementById('locate-btn').addEventListener('click', () => {
    map.locate({ setView: true, maxZoom: 16 });
  });
  map.on('locationfound', (e) => {
    L.circleMarker(e.latlng, { radius: 7, color: '#EDEDEA', fillColor: '#6FB1E0', fillOpacity: 1 }).addTo(map);
  });

  const panel = document.getElementById('panel');
  document.getElementById('panel-grip').addEventListener('click', () => panel.classList.toggle('open'));

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
</script>
</body>
</html>
